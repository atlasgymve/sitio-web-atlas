<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATLAS - Plataforma de Entrenamiento</title>
  <link rel="icon" type="image/png" href="assets/logo-icon-white.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,600;1,700;1,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 1rem;">
        <img src="assets/logo-white.png" alt="ATLAS GYM" style="max-height: 60px; width: auto;">
      </div>
      <p class="auth-subtitle">Ingresa tu correo o cédula registrada para acceder al portal</p>

      <!-- Banner de Error -->
      <div id="errorMsg" class="error-banner hidden"></div>

      <!-- FORMULARIO LOGIN -->
      <form id="loginForm" onsubmit="login(event)">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Correo Electrónico o Cédula</label>
          <input type="text" id="loginEmail" class="form-input" placeholder="Correo o Cédula (Ej: 12345678)" oninput="checkEmailForAdmin()" required>
        </div>

        <div id="adminPasswordGroup" class="form-group hidden">
          <label class="form-label" for="loginPassword" style="color: var(--link);">Contraseña de Acceso</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" style="border-color: var(--border-strong);">
        </div>

        <button type="submit" class="btn-primary" style="margin-top: 1.5rem;">
          Ingresar al Portal
        </button>
      </form>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
